<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="output.css" rel="stylesheet" />
  </head>
  <body
    class="bg-white text-gray-900 font-sans antialiased min-h-screen relative pb-20"
  >
    <!-- Navigation Section (Sticky Navbar) -->
    <header
      class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-100 px-6 py-4"
    >
      <div class="max-w-7xl mx-auto flex items-center justify-between">
        <!-- Logo -->
        <div
          class="flex items-center space-x-1 font-bold text-xl text-gray-900"
        >
          <span>✦</span>
          <span>Project</span>
        </div>

        <!-- Navigation Links & CTA -->
        <nav class="flex items-center space-x-8">
          <a
            href="#"
            class="text-sm text-gray-600 hover:text-gray-900 font-medium"
            >Product</a
          >
          <a
            href="#"
            class="text-sm text-gray-600 hover:text-gray-900 font-medium"
            >Solutions</a
          >
          <a
            href="#"
            class="text-sm text-gray-600 hover:text-gray-900 font-medium"
            >Resources</a
          >
          <a
            href="#"
            class="text-sm text-gray-600 hover:text-gray-900 font-medium"
            >Pricing</a
          >
          <a
            href="#"
            class="text-sm font-semibold text-gray-900 hover:text-gray-700"
            >Log in</a
          >
          <a
            href="#"
            class="bg-gray-900 text-white text-sm font-medium px-4 py-2 rounded-md hover:bg-gray-800 transition"
            >Get AI free</a
          >
        </nav>
      </div>
    </header>

    <!-- Hero Section -->
    <main
      class="bg-gradient-to-bo from-orange-50 via-amber-50/40 to-white pt-16 pb-24 px-4 sm:px-6 lg:px-8"
    >
      <!-- Hero Headline & Description -->
      <div class="max-w-4xl mx-auto text-center">
        <h1
          class="text-5xl sm:text-5xl font-extrabold text-gray-900 tracking-tight leading-tight"
        >
          Write, plan, share.<br />
          With AI at your side.
        </h1>
        <p
          class="mt-6 text-lg sm:text-xl text-gray-600 max-w-2xl mx-auto font-normal"
        >
          It is the connected workspace where better, faster work happens. Now
          with AI.
        </p>

        <!-- Call-To-Action Buttons (using relative & absolute positioning) -->
        <div class="mt-8 flex justify-center items-center">
          <div class="relative inline-flex items-center space-x-3">
            <!-- Button 1: Get AI free -->
            <a
              href="#"
              class="bg-gray-900 text-white font-medium text-sm px-6 py-3 rounded-md hover:bg-gray-800 transition flex items-center shadow-sm"
            >
              Get AI free <span class="ml-2">→</span>
            </a>
            <!-- Button 2: Request a demo -->
            <a
              href="#"
              class="bg-blue-600 text-white font-medium text-sm px-6 py-3 rounded-md hover:bg-blue-700 transition shadow-sm"
            >
              Request a demo
            </a>
          </div>
        </div>
      </div>

      <!-- Dashboard Preview & Floating Information Cards Container -->
      <div class="relative max-w-5xl mx-auto mt-16 .min-h-[480px]">
        <!-- Dashboard Preview Image (Centered via Absolute Positioning) -->
        <div class="absolute inset-x-0 top-0 flex justify-center z-10">
          <div
            class="w-full max-w-2xl bg-white p-2 rounded-xl shadow-lg border border-gray-100"
          >
            <img
              src="https://images.unsplash.com/photo-1531403009284-440f080d1e12?auto=format&fit=crop&w=1000&q=80"
              alt="Dashboard Preview"
              class="rounded-lg w-full .h-[320px] object-cover"
            />
          </div>
        </div>

        <!-- Floating Information Cards -->

        <!-- Card 1: Tasks Card (Left Positioned) -->
        <div
          class="absolute left-4 sm:left-12 top-28 z-20 bg-white p-4 rounded-xl shadow-xl border border-gray-100 w-52"
        >
          <div class="flex items-center space-x-3">
            <div
              class="w-8 h-8 rounded-lg bg-pink-100 text-pink-500 flex items-center justify-center text-xs font-bold"
            >
              <i class="fa-regular font-bold fa-square-check"></i>
            </div>
            <div>
              <div class="text-xs font-bold text-gray-900">Tasks</div>
              <div class="text-[11px] text-gray-500">
                12 tasks completed today
              </div>
            </div>
          </div>
        </div>

        <!-- Card 2: Project Status Card (Right Top Positioned) -->
        <div
          class="absolute right-4 sm:right-16 top-16 z-20 bg-white p-4 rounded-xl shadow-xl border border-gray-100 w-52"
        >
          <div class="flex items-start space-x-3">
            <div
              class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xs mt-0.5"
            >
              ✓
            </div>
            <div>
              <div class="text-xs font-bold text-gray-900">Project Status</div>
              <div class="text-xs font-semibold text-emerald-600 mt-2">
                On Track
              </div>
            </div>
          </div>
        </div>

        <!-- Card 3: Team Activity Card (Right Bottom Positioned) -->
        <div
          class="absolute right-8 sm:right-24 bottom-6 z-20 bg-white p-3.5 rounded-xl shadow-xl border border-gray-100 w-48"
        >
          <div class="text-xs font-bold text-gray-900 mb-2">Team Activity</div>
          <div class="flex items-center space-x-2">
            <div class="flex -space-x-2 overflow-hidden">
              <img
                class="inline-block h-6 w-6 rounded-full ring-2 ring-white"
                src="https://images.unsplash.com/photo-1491528323818-fdd1faba62cc?auto=format&fit=crop&w=100&q=80"
                alt="Avatar"
              />
              <img
                class="inline-block h-6 w-6 rounded-full ring-2 ring-white"
                src="https://images.unsplash.com/photo-1550525811-e5869dd03032?auto=format&fit=crop&w=100&q=80"
                alt="Avatar"
              />
              <img
                class="inline-block h-6 w-6 rounded-full ring-2 ring-white"
                src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=100&q=80"
                alt="Avatar"
              />
            </div>
            <span class="text-xs text-gray-500 font-medium">+5 online</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Fixed Chat Widget (Bottom Right) -->
    <button
      aria-label="Open chat"
      class="fixed bottom-6 right-6 z-50 bg-gray-900 hover:bg-black text-white p-4 rounded-xl shadow-2xl transition-transform hover:scale-105 flex items-center justify-center"
    >
      <i class="fa-solid fa-comment text-lg"></i>
    </button>
  </body>
</html>
